[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beets-pysacd"
version = "0.1.0"
description = "beets plugin: import SACD ISO images through pysacd"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
# 2.12: the oldest beets whose hooks, AlbumMatch and test helpers this plugin is verified against
dependencies = ["beets>=2.12,<3", "pysacd>=0.2"]

[project.optional-dependencies]
# pinned, like pysacd's: an unpinned upgrade can change the rule set on unchanged code
dev = ["pytest==9.1.1", "ruff==0.17.0", "mypy==2.4.0"]

[project.urls]
Homepage = "https://github.com/aclater/beets-pysacd"

[tool.setuptools]
# beetsplug is a namespace package shared with beets and other plugins: no __init__.py
packages = ["beetsplug"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

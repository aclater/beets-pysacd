[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beets-pysacd"
version = "0.2.3"
description = "beets plugin: import SACD ISO images through pysacd"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "LICENSES/CC-BY-4.0.txt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
# 2.12: the oldest beets whose hooks, AlbumMatch and test helpers this plugin is verified against
dependencies = ["beets>=2.12,<3", "pysacd>=0.2"]

[project.optional-dependencies]
# pinned, like pysacd's: an unpinned upgrade can change the rule set on unchanged code
dev = ["pytest==9.2.0", "ruff==0.17.4", "mypy==2.4.1", "coverage==7.17.2"]

[project.urls]
Homepage = "https://github.com/dsd-toolbox/beets-pysacd"
Source = "https://github.com/dsd-toolbox/beets-pysacd"
Issues = "https://github.com/dsd-toolbox/beets-pysacd/issues"
Changelog = "https://github.com/dsd-toolbox/beets-pysacd/blob/main/CHANGELOG.md"
Documentation = "https://github.com/dsd-toolbox/beets-pysacd/blob/main/docs/README.md"

[tool.setuptools]
# beetsplug is a namespace package shared with beets and other plugins: no __init__.py
packages = ["beetsplug"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# beetsplug is a namespace package: map its files to beetsplug.<module>, not top-level modules
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# CI's coverage leg (ci.yml). "beetsplug" is this checkout's directory, not the namespace
# package, so beets' own plugins aren't measured.
[tool.coverage.run]
source = ["beetsplug"]
branch = true

[tool.coverage.report]
skip_empty = true

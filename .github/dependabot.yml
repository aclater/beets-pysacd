# Keeps the commit-SHA pins in .github/workflows and the Python dependencies
# current.  Actions are pinned by SHA rather than tag so a moved tag can't
# change what runs in CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # New releases wait two weeks before a PR is opened.
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  # pyproject.toml's dev pins, and CI's hash lock with the newest beets (scripts/lock.py), so
  # the "beets latest" and "pysacd release" legs follow new releases. A release that brings a
  # new dependency fails the locked install; rerun scripts/lock.py on that PR.
  - package-ecosystem: pip
    directories: ["/", "/locks/latest"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
      # the owner's own package: CI should test a new pysacd release at once
      exclude: ["pysacd"]
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: deps
  # The lock with the oldest supported beets: everything else stays current, beets stays on
  # the floor in pyproject.toml (patch releases only).
  - package-ecosystem: pip
    directory: /locks/oldest
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
      exclude: ["pysacd"]
    ignore:
      - dependency-name: beets
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      python-oldest-beets:
        patterns: ["*"]
    commit-message:
      prefix: deps

# The test suite mocks MusicBrainz. Once a week, tests/test_live_musicbrainz.py
# runs the plugin's matching against one real release: one request through
# pysacd's client and one through beets' MusicBrainz plugin, each throttled to
# MusicBrainz's 1 request/second, with the repository URL as the User-Agent
# contact. Never on pull requests.

name: live-musicbrainz

on:
  schedule:
    - cron: "53 6 * * 3"  # weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lookup:
    name: live MusicBrainz matching
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Fedora 44, pinned by digest: the plugin is linted and tested in Red Hat-derived userland;
      # the runner (Ubuntu, GitHub's only hosted Linux) only hosts the container.
      image: registry.fedoraproject.org/fedora@sha256:b414c09be79dd1f32529b55b096b6bb30435d82ee16fbdbbabf8985eb5f86db0
    defaults:
      run:
        shell: bash
    steps:
      - name: Python 3.13 (Fedora)
        env:
          PY: "3.13"
        run: |
          dnf -y -q --setopt=install_weak_deps=False install git-core findutils "/usr/bin/python$PY"
          dnf clean all
          "python$PY" -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the plugin, beets and pysacd
        # hash-locked (scripts/lock.py, #19)
        run: |
          pip install --require-hashes --only-binary :all: -r locks/latest/requirements.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Live matching
        env:
          PYSACD_LIVE_MB: "1"
        run: python -m pytest -v tests/test_live_musicbrainz.py

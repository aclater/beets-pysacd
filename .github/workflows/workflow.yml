# Release: build the sdist and wheel, test them in a clean environment, attest
# them, attach them and their provenance bundles (<file>.intoto.jsonl) to a GitHub
# release, then publish to PyPI through trusted
# publishing. Runs on v* tags (the `pypi` environment accepts nothing else), and
# builds without publishing on pull requests that touch packaging.

name: release

on:
  pull_request:
    paths: ["pyproject.toml", "beetsplug/**", "locks/**", ".github/workflows/workflow.yml"]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # build and setuptools from the hash lock (scripts/lock.py, #19), without isolation, so
      # nothing unhashed is downloaded
      - name: Build
        run: |
          python -m venv /tmp/build
          /tmp/build/bin/pip install -q --require-hashes --only-binary :all: -r locks/latest/requirements.txt
          /tmp/build/bin/python -m build --no-isolation

      # A fresh environment: the locked dependencies, then the wheel without fetching
      # anything else; pip check fails if the wheel declares a dependency the lock lacks.
      - name: The wheel installs and the plugin loads
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install -q --require-hashes --only-binary :all: -r locks/latest/requirements.txt
          /tmp/clean/bin/pip install -q --no-deps dist/*.whl
          /tmp/clean/bin/pip check
          mkdir -p /tmp/beetsdir
          printf 'plugins: sacd\nlibrary: /tmp/beetsdir/l.db\ndirectory: /tmp/beetsdir/m\n' > /tmp/beetsdir/config.yaml
          BEETSDIR=/tmp/beetsdir /tmp/clean/bin/beet sacd-info --help

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist

      - name: Build provenance attestations
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*

      # The attestation also goes on the release as <artifact>.intoto.jsonl, for the wheel and
      # the sdist (the same bundle covers both), so it can be checked offline and OpenSSF
      # Scorecard sees signed releases (#20). Each copy is verified first.
      - name: Provenance bundles
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir provenance
          for f in dist/*; do
            b="provenance/$(basename "$f").intoto.jsonl"
            cp "$BUNDLE" "$b"
            gh attestation verify "$f" --bundle "$b" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/workflow.yml"
          done

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "beets-pysacd $TAG"
          gh release upload "$TAG" dist/* provenance/* --repo "$GITHUB_REPOSITORY" --clobber

  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

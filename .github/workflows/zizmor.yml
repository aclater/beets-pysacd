# zizmor: security linter for GitHub Actions workflows (template injection,
# credential persistence, excessive permissions, unpinned uses, ...). Offline
# audits only; findings are printed as annotations and fail the check.
# Locally: `pipx run zizmor==1.30.1 --no-online-audits .github/workflows`

name: zizmor

on:
  pull_request:
    paths: [".github/workflows/**"]
  push:
    branches: [main]
    paths: [".github/workflows/**"]

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The action runs zizmor's container image, pinned by digest for each version
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b  # v0.8.0
        with:
          version: 1.30.1
          inputs: .github/workflows
          online-audits: false
          advanced-security: false
          annotations: true

# CI: lint, type-check and test the plugin against the oldest supported and the
# newest beets, on Linux, macOS and Windows, with the released pysacd (what users
# get) and with pysacd's master branch (what's coming).

name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * 1"  # weekly: catches new beets and pysacd releases without a code change

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # hash-locked dependencies (scripts/lock.py, #19), then the plugin itself
      - name: Install
        run: |
          pip install --require-hashes --only-binary :all: -r locks/latest/requirements.txt
          pip install --no-deps --no-build-isolation -e .

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy beetsplug

  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }}, beets ${{ matrix.beets }}, pysacd ${{ matrix.pysacd }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11", beets: oldest, pysacd: release}
          - {os: ubuntu-latest, python: "3.11", beets: latest, pysacd: release}
          - {os: ubuntu-latest, python: "3.12", beets: latest, pysacd: release}
          # this leg also measures coverage (job summary and the `coverage` artifact)
          - {os: ubuntu-latest, python: "3.13", beets: latest, pysacd: release, coverage: true}
          - {os: ubuntu-latest, python: "3.14", beets: latest, pysacd: release}
          - {os: ubuntu-latest, python: "3.13", beets: latest, pysacd: master}
          - {os: macos-latest, python: "3.13", beets: latest, pysacd: release}
          - {os: windows-latest, python: "3.13", beets: latest, pysacd: release}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Every dependency from a hash-locked file (scripts/lock.py, #19): locks/oldest has beets at
      # the floor in pyproject.toml, locks/latest the newest beets; Dependabot keeps both current.
      # Then the plugin itself, with nothing else fetched.
      - name: Install the plugin and beets
        shell: bash
        env:
          BEETS: ${{ matrix.beets }}
        run: |
          pip install --require-hashes --only-binary :all: -r "locks/$BEETS/requirements.txt"
          pip install --no-deps --no-build-isolation -e .
          pip check
          python -c "import beets; print('beets', beets.__version__)"
          if [ "$BEETS" = oldest ]; then
            # the floor declared in pyproject.toml, so the lock and it can't drift apart
            python - <<'PY'
          import re, tomllib, beets
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          floor = next(re.search(r">=\s*([0-9.]+)", d).group(1) for d in deps if d.startswith("beets"))
          assert beets.__version__.startswith(floor + "."), f"beets {beets.__version__} is not the floor {floor}"
          PY
          fi

      # The tests build synthetic SACD images with pysacd's test generator, which
      # isn't part of the pysacd package: check out the matching pysacd source.
      - name: Find the pysacd ref
        id: pysacd
        shell: bash
        run: |
          if [ "${{ matrix.pysacd }}" = master ]; then
            ref=master
          else
            ref="v$(python -c 'import importlib.metadata as m; print(m.version("pysacd"))')"
          fi
          # Only master or a release tag of the owner's own pysacd repository
          [[ "$ref" =~ ^(master|v[0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::unexpected pysacd ref $ref"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: aclater/pysacd
          ref: ${{ steps.pysacd.outputs.ref }}
          path: pysacd-src
          persist-credentials: false

      # Built with the locked setuptools and installed over the released pysacd without
      # fetching anything; pip check fails if master needs a dependency the lock lacks.
      - name: Install pysacd from master
        if: matrix.pysacd == 'master'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libflac-dev
          # a literal *.whl path, which Scorecard recognises as a local wheel install
          pip wheel --no-deps --no-build-isolation -w pysacd-wheel ./pysacd-src
          pip install --no-deps --force-reinstall pysacd-wheel/*.whl
          pip check

      - name: Tests
        shell: bash
        env:
          PYSACD_TESTS: ${{ github.workspace }}/pysacd-src/tests
          PYTHONUTF8: "1"
          COVERAGE: ${{ matrix.coverage && 'true' || 'false' }}
        run: |
          python -c "import pysacd, pysacd._native as n; print('pysacd', pysacd.__version__, n.build_info())"
          if [ "$COVERAGE" = true ]; then
            # coverage.py, pinned in the dev extra and the lock; settings in pyproject.toml
            coverage run -m pytest -q
            coverage report
            { echo "## Coverage"; coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
            coverage html -d coverage-html
            coverage xml -o coverage.xml
          else
            pytest -q
          fi

      - name: Upload the coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: |
            coverage-html/
            coverage.xml
          retention-days: 14

  privacy:
    # No hostnames, private IPs or local paths in files or commit identities.
    # Extra names come from the PRIVATE_NAMES repository variable (a regex), so
    # they never appear in the repository themselves.
    name: no private details
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan files and commit identities
        env:
          PRIVATE_NAMES: ${{ vars.PRIVATE_NAMES }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-private-names.sh

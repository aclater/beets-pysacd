# CI: lint, type-check and test the plugin against the oldest supported and the
# newest beets, on Linux, macOS and Windows, with the released pysacd (what users
# get) and with pysacd's master branch (what's coming).

name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * 1"  # weekly: catches new beets and pysacd releases without a code change

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy beetsplug

  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }}, beets ${{ matrix.beets }}, pysacd ${{ matrix.pysacd }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11", beets: oldest, pysacd: release}
          - {os: ubuntu-latest, python: "3.11", beets: latest, pysacd: release}
          - {os: ubuntu-latest, python: "3.12", beets: latest, pysacd: release}
          - {os: ubuntu-latest, python: "3.13", beets: latest, pysacd: release}
          - {os: ubuntu-latest, python: "3.14", beets: latest, pysacd: release}
          - {os: ubuntu-latest, python: "3.13", beets: latest, pysacd: master}
          - {os: macos-latest, python: "3.13", beets: latest, pysacd: release}
          - {os: windows-latest, python: "3.13", beets: latest, pysacd: release}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install the plugin and beets
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          if [ "${{ matrix.beets }}" = oldest ]; then
            # the floor declared in pyproject.toml, so the two can't drift apart
            floor=$(python -c "import tomllib,re; d=tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']; print(next(re.search(r'>=\s*([0-9.]+)', x).group(1) for x in d if x.startswith('beets')))")
            pip install "beets==$floor.*"
          fi
          python -c "import beets; print('beets', beets.__version__)"

      # The tests build synthetic SACD images with pysacd's test generator, which
      # isn't part of the pysacd package: check out the matching pysacd source.
      - name: Find the pysacd ref
        id: pysacd
        shell: bash
        run: |
          if [ "${{ matrix.pysacd }}" = master ]; then
            ref=master
          else
            ref="v$(python -c 'import importlib.metadata as m; print(m.version("pysacd"))')"
          fi
          # Only master or a release tag of the owner's own pysacd repository
          [[ "$ref" =~ ^(master|v[0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::unexpected pysacd ref $ref"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: aclater/pysacd
          ref: ${{ steps.pysacd.outputs.ref }}
          path: pysacd-src
          persist-credentials: false

      - name: Install pysacd from master
        if: matrix.pysacd == 'master'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libflac-dev
          pip install ./pysacd-src

      - name: Tests
        shell: bash
        env:
          PYSACD_TESTS: ${{ github.workspace }}/pysacd-src/tests
          PYTHONUTF8: "1"
        run: |
          python -c "import pysacd, pysacd._native as n; print('pysacd', pysacd.__version__, n.build_info())"
          pytest -q

  privacy:
    # No hostnames, private IPs or local paths in files or commit identities.
    # Extra names come from the PRIVATE_NAMES repository variable (a regex), so
    # they never appear in the repository themselves.
    name: no private details
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan files and commit identities
        env:
          PRIVATE_NAMES: ${{ vars.PRIVATE_NAMES }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-private-names.sh

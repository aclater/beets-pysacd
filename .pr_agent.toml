# Settings for the AI pull-request reviewer (.github/workflows/pr-agent.yml).
# The model is set in the workflow's env, so it applies even before this file
# reaches the default branch.

[github_action_config]
# Re-review after each push, not only when the PR opens.
handle_push_trigger = true
push_commands = ["/review"]

[pr_reviewer]
require_tests_review = true
require_security_review = true
require_estimate_effort_to_review = false
extra_instructions = """
beets-pysacd is a beets plugin (beetsplug/sacd.py) that imports SACD ISO images:
it reads them with pysacd, extracts each area to DSF or FLAC in a staging
directory, and runs beets' normal import on that, pinned to the MusicBrainz
release and medium (stereo or multichannel layer) pysacd matched. CLAUDE.md
holds the full rules. Review against these first:

- Never lose or damage user data: an ISO is deleted only with remove_iso and
  only after its import is verified; staging is cleaned up on every path; the
  user's own beets settings (copy/move/write) still apply to their other files.
- The medium pin: hybrid-SACD layers share MusicBrainz recording IDs, so the
  plugin must keep items on the medium pysacd matched and keep per-layer media.
  Flag changes that could let beets reassign layers or write the album "Media".
- Untrusted input: disc text and MusicBrainz data are attacker-controlled; they
  must not reach a shell, eval, or file paths outside beets' library directory.
- beets compatibility: the plugin supports every beets version from the floor
  in pyproject.toml to the latest 2.x; flag uses of APIs newer than the floor.
- Privacy: no hostnames, private IPs, local paths or personal details.
- Docs ship with the change; bug fixes include a regression test.

Don't comment on formatting or import order (ruff enforces them).
"""

[pr_code_suggestions]
extra_instructions = """
Follow the same rules as the review: user data safety, the medium pin, hostile
input, beets-version compatibility. Skip pure style suggestions.
"""
